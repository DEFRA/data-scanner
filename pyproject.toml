[project]
name = "pii-scanner"
version = "0.1.0"
description = "Scan a GitHub organisation's public repositories (full history) for leaked personal data"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "jinja2>=3.1",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "pypdf>=4",
  "pillow>=10",
]

[project.optional-dependencies]
ner = ["spacy>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
pii-scan = "pii_scanner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
